services:
  db:
    image: postgres:16-alpine
    container_name: payroll-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: payroll
      POSTGRES_USER: payroll
      POSTGRES_PASSWORD: payroll
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payroll -d payroll"]
      interval: 10s
      timeout: 5s
      retries: 5

  payroll:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payroll-app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/payroll
      SPRING_DATASOURCE_USERNAME: payroll
      SPRING_DATASOURCE_PASSWORD: payroll
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_FLYWAY_CONNECT_RETRIES: 60
      SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: 60000
    restart: unless-stopped

volumes:
  postgres_data:
